<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>外部リンクの確認 - Book Manager</title>
	<link rel="stylesheet" href="../css/style.css">
</head>

<body>
	<div class="container">
		<h1>外部リンクの確認</h1>

		<nav>
			<a href="index.html">トップ</a>
			<a href="search.html">蔵書検索</a>
			<a href="list.html">蔵書一覧</a>
			<a href="add.html">書籍追加・データ検索</a>
			<a href="confirm.html">編集(code-server)</a>
			<a href="settings.html">設定</a>
		</nav>

		<div class="card">
			<p>外部サイトに移動しようとしています:</p>
			<div class="result" id="urlDisplay">読み込み中...</div>
			<p>このリンクは信用できるものですか？</p>

			<div class="button-group">
				<button id="confirmButton">移動する</button>
				<button onclick="location.href='index.html'">キャンセル</button>
			</div>
		</div>
	</div>

	<script src="../js/settings.js"></script>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			const params = new URLSearchParams(window.location.search);
			const paramUrl = params.get('url');

			function setupConfirmPage(url) {
				document.getElementById('urlDisplay').textContent = url;
				document.getElementById('confirmButton').addEventListener('click', function () {
					window.open(url, '_blank');
					location.href = 'index.html';
				});
			}

			if (paramUrl) {
				setupConfirmPage(paramUrl);
			} else {
				loadCodeServerUrl(function (url) {
					if (url) {
						setupConfirmPage(url);
					} else {
						document.getElementById('urlDisplay').textContent = 'URLが指定されていません';
						document.getElementById('confirmButton').disabled = true;
					}
				});
			}
		});
	</script>
</body>

</html>
